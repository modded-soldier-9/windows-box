name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  catalog-validate:
    name: Catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore (Core / Cli / Elevator / Tests)
        run: |
          dotnet restore src/WindowsBox.Core/WindowsBox.Core.csproj
          dotnet restore src/WindowsBox.Cli/WindowsBox.Cli.csproj
          dotnet restore src/WindowsBox.Elevator/WindowsBox.Elevator.csproj
          dotnet restore tests/WindowsBox.Tests/WindowsBox.Tests.csproj

      - name: Build Core + CLI + Elevator
        run: |
          dotnet build src/WindowsBox.Core/WindowsBox.Core.csproj -c Release --no-restore
          dotnet build src/WindowsBox.Cli/WindowsBox.Cli.csproj -c Release --no-restore
          dotnet build src/WindowsBox.Elevator/WindowsBox.Elevator.csproj -c Release --no-restore

      - name: Publish Native AOT (Cli + Elevator)
        run: |
          dotnet publish src/WindowsBox.Cli/WindowsBox.Cli.csproj -c Release -r linux-x64 -o artifacts/wbox --no-restore
          dotnet publish src/WindowsBox.Elevator/WindowsBox.Elevator.csproj -c Release -r linux-x64 -o artifacts/elevator --no-restore

      - name: Validate service catalog (AOT wbox)
        run: ./artifacts/wbox/wbox catalog validate --catalog catalog/services

      - name: Elevator ping (AOT)
        run: ./artifacts/elevator/WindowsBox.Elevator --ping

      - name: Unit tests (fakes, Linux)
        run: dotnet test tests/WindowsBox.Tests/WindowsBox.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=catalog.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-test-results
          path: "**/TestResults/*.trx"

  build-windows:
    name: Build & test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore solution
        run: |
          dotnet restore src/WindowsBox.Core/WindowsBox.Core.csproj
          dotnet restore src/WindowsBox.Cli/WindowsBox.Cli.csproj
          dotnet restore src/WindowsBox.Elevator/WindowsBox.Elevator.csproj
          dotnet restore tests/WindowsBox.Tests/WindowsBox.Tests.csproj
          dotnet restore src/WindowsBox.App/WindowsBox.App.csproj

      - name: Build Core / Cli / Elevator / Tests
        run: |
          dotnet build src/WindowsBox.Core/WindowsBox.Core.csproj -c Release --no-restore
          dotnet build src/WindowsBox.Cli/WindowsBox.Cli.csproj -c Release --no-restore
          dotnet build src/WindowsBox.Elevator/WindowsBox.Elevator.csproj -c Release --no-restore
          dotnet build tests/WindowsBox.Tests/WindowsBox.Tests.csproj -c Release --no-restore

      - name: Publish Native AOT (Cli + Elevator)
        run: |
          dotnet publish src/WindowsBox.Cli/WindowsBox.Cli.csproj -c Release -r win-x64 -o artifacts/wbox --no-restore
          dotnet publish src/WindowsBox.Elevator/WindowsBox.Elevator.csproj -c Release -r win-x64 -o artifacts/elevator --no-restore

      - name: Build WinUI shell
        # Scaffold compiles with Windows App SDK 1.8 on windows-latest; keep non-blocking in M0 if tooling drifts.
        continue-on-error: true
        run: dotnet build src/WindowsBox.App/WindowsBox.App.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/WindowsBox.Tests/WindowsBox.Tests.csproj -c Release --no-build --logger "trx;LogFileName=windows.trx"

      - name: Catalog validate (AOT wbox)
        shell: pwsh
        run: ./artifacts/wbox/wbox.exe catalog validate --catalog catalog/services

      - name: Elevator ping (AOT)
        shell: pwsh
        run: ./artifacts/elevator/WindowsBox.Elevator.exe --ping

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: "**/TestResults/*.trx"

name: Lint

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  format:
    name: dotnet format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: |
          dotnet restore src/WindowsBox.Core/WindowsBox.Core.csproj
          dotnet restore src/WindowsBox.Cli/WindowsBox.Cli.csproj
          dotnet restore src/WindowsBox.Elevator/WindowsBox.Elevator.csproj
          dotnet restore tests/WindowsBox.Tests/WindowsBox.Tests.csproj

      - name: Verify formatting (whitespace / style — warn only until baseline)
        continue-on-error: true
        run: |
          dotnet format whitespace src/WindowsBox.Core/WindowsBox.Core.csproj --verify-no-changes
          dotnet format whitespace src/WindowsBox.Cli/WindowsBox.Cli.csproj --verify-no-changes
          dotnet format whitespace src/WindowsBox.Elevator/WindowsBox.Elevator.csproj --verify-no-changes
          dotnet format whitespace tests/WindowsBox.Tests/WindowsBox.Tests.csproj --verify-no-changes

      - name: Catalog schema sanity
        run: |
          dotnet build src/WindowsBox.Cli/WindowsBox.Cli.csproj -c Release
          dotnet run --project src/WindowsBox.Cli/WindowsBox.Cli.csproj -c Release --no-build -- catalog validate --catalog catalog/services
